name: Grapher
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.2"
    CURRENT_PROJECT_VERSION: "202608302130"

targets:
  Grapher-iOS:
    type: application
    # One target, two destinations — same shape as charwork/wordroot. There are no
    # platform-specific sources to exclude, so a second target would be pure duplication.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.grapher
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886. Hand-committed rather
        # than generated via xcodegen `entitlements.properties` (drops keys).
        CODE_SIGN_ENTITLEMENTS: Grapher.entitlements
        # Per-SDK, not one shared file: the iOS file's `application-identifier` is not a
        # valid macOS entitlement and makes Mac profile creation fail outright.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Grapher-macOS.entitlements

schemes:
  Grapher-iOS:
    build:
      targets:
        Grapher-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
